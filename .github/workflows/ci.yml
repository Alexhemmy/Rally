name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # BUNDLE SMOKE CHECK — verifies every screen actually compiles and
  # resolves (replaces the old expo-start-tunnel job, which hung forever
  # in CI because a dev server never exits).
  mobile-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Mobile Dependencies
        run: npm install --ignore-scripts
      - name: Bundle the app (Metro export — fails on any broken screen)
        run: npx expo export --platform android --output-dir dist-check
        env:
          CI: "1"
      - name: Upload bundle artifact (debug aid)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-bundle
          path: mobile/dist-check
          retention-days: 3

  # BUILD FOR ANDROID (native installable APK via EAS cloud)
  # Skips cleanly when EXPO_TOKEN is not configured instead of failing red.
  mobile-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install Mobile Dependencies (skip native prepare scripts)
        run: npm install --ignore-scripts

      - name: Check EXPO_TOKEN is available
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXP_TOKEN }}
          EXPO_TOKEN_ALT: ${{ vars.EXP_TOKEN }}
        run: |
          echo "EXPO_TOKEN secret length: ${#EXPO_TOKEN}"
          echo "EXPO_TOKEN var length: ${#EXPO_TOKEN_ALT}"
          if [ -z "$EXPO_TOKEN" ] && [ -z "$EXPO_TOKEN_ALT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN not visible to this job — skipping EAS build."
          elif [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN found only as a variable — falling back to it."
            echo "EXPO_TOKEN=$EXPO_TOKEN_ALT" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize EAS Project Configuration
        if: steps.token.outputs.available == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account renecmoons-team --non-interactive

      - name: Build Native Android APK
        if: steps.token.outputs.available == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: eas build --platform android --profile preview --non-interactive --no-wait
