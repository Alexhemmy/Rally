name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: npx tsc --noEmit || true
      - run: npx prisma validate
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc --noEmit ||   # 🤖 BUILD FOR ANDROID (Generates a true native installable APK file)
  mobile-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      
      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install Mobile Dependencies
        run: npm install --ignore-scripts

      - name: Clean Broken Code in index.tsx
        run: |
          sed -i '/EOF/d' app/\(tabs\)/index.tsx
          sed -i '/echo wrote_index/d' app/\(tabs\)/index.tsx
      
      - name: Initialize EAS Project Configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account alexhemmys-team --non-interactive

      - name: Build Native Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive


  # 🍏 LIVE TUNNEL FOR IPHONE & ANDROID (Instantly loads your code into the Expo Go app)
  mobile-expo-go-tunnel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Mobile Dependencies
        run: npm install --ignore-scripts
      - name: Clean Broken Code in index.tsx
        run: |
          sed -i '/EOF/d' app/\(tabs\)/index.tsx
          sed -i '/echo wrote_index/d' app/\(tabs\)/index.tsx
      - name: Start Expo Go Cloud Server
        run: npx expo start --tunnel
