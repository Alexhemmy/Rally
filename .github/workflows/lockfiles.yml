name: Lockfiles

# Resolve and commit mobile/package-lock.json whenever package.json changes,
# so EAS and CI install from the lockfile (reproducible) instead of
# re-resolving against the live npm registry on every build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/package.json'
      - '.github/workflows/lockfiles.yml'

permissions:
  contents: write

concurrency:
  group: lockfiles
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate mobile package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: mobile

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date — nothing to commit."
          else
            git commit -m "chore: update mobile package-lock.json [skip ci]"
            git push
            echo "Lockfile committed."
          fi
