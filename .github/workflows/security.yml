name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, Mondays 06:00 UTC

jobs:
  audit:
    name: Dependency audit (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: npm audit (high and above)
        run: npm audit --audit-level=high --omit=dev || true

  audit-web:
    name: Dependency audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: npm audit (high and above)
        run: npm audit --audit-level=high --omit=dev || true

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for hardcoded secrets and keys
        run: |
          set -e
          PATTERNS='(
            sk_live_[0-9a-zA-Z]{16,}|
            rk_live_[0-9a-zA-Z]{16,}|
            AKIA[0-9A-Z]{16}|
            -----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|
            (password|secret|token|api[_-]?key)["'"'"'\s]*[:=]["'"'"'\s]*[A-Za-z0-9+/=_-]{24,}
          )'
          # Skip .env.example, docs, lock files
          if git ls-files -z |
              xargs -0 grep -IlE '.(env|md)$|package-lock.json' |
              xargs -r rm -f 2>/dev/null; then :; fi
          FOUND=$(git ls-files -z | xargs -0 grep -InE "$PATTERNS" 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Possible hardcoded secrets found"
            echo "$FOUND"
            exit 1
          fi
          echo "No secret patterns found."

  typecheck-backend:
    name: Backend type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npx prisma generate
      - run: npx tsc --noEmit
