services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally
      POSTGRES_DB: rally
    ports:
      - "5432:5432"
    volumes:
      - rally_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rally_pg:
