services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rally
      POSTGRES_PASSWORD: rally
      POSTGRES_DB: rally
    ports:
      - "5432:5432"
    volumes:
      - rally_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run db:seed && npm run dev"
    environment:
      DATABASE_URL: postgresql://rally:rally@db:5432/rally?schema=public
      JWT_SECRET: dev-secret-change-me
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      PAYMENT_PROVIDER: mock
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  rally_pg:
